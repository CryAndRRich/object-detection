# LLaVA-OneVision-2-8B-Instruct (lmms-lab, 05/2026; nền Qwen3-8B) — vLLM >= 0.25.0 (`LlavaOnevision2ForConditionalGeneration`) offline
# trên Kaggle 2 × T4 (ZETA6 open-source), cách chạy của tác giả (base.yaml). T4: fp16 đầy đủ chia 2 card. Docs KHÔNG nói có ra box
# (grounding 2D trong bài báo ra điểm pixel). Few-shot tác giả = 3 ảnh / prompt ⇒ ảnh <= ~1 MP, max_model_len 12288.
# Pilot 2026-11-04 (vLLM 0.33, TP 2, KV 3 GiB): 11,5 GiB / card, ~5 s / ảnh CE-130 (10 / khối), latency ~11 s, ra ~0,3–0,5k token;
# chép "top 3" của few-shot (TB 4,9 / 6,8 box, 3 box ở 13 / 20 ảnh), toạ độ vượt ảnh như Qwen (20 / 20 ảnh mọi toạ độ <= 1000; đọc 0–1000 ⇒ 100 % trong ảnh) ⇒ `coord: norm1000`.
# KV 5 GiB / card, 24 chuỗi, khối 64.
base: ../base.yaml
name: llava-ov2-8b
backend: vllm
model: lmms-lab-encoder/LLaVA-OneVision-2-8B-Instruct
price: {in: 0.0, out: 0.0}
coord: norm1000        # model trả thang 0–1000 (cách nó được huấn luyện), prompt tác giả giữ nguyên
chunk: 64
chat_template_kwargs: {enable_thinking: false}   # nền Qwen3: tắt suy nghĩ nếu template có cờ này
vllm:
  gpu_mem_gib: 13.5
  kv_cache_gib: 5.0
engine:
  dtype: half
  trust_remote_code: true
  tensor_parallel_size: 2
  max_model_len: 12288
  max_num_seqs: 24
  limit_mm_per_prompt: {image: 3, video: 0}
  mm_processor_kwargs: {max_pixels: 1048576}
