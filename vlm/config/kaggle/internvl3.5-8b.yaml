# InternVL3.5-8B (OpenGVLab, 08/2025) — vLLM offline trên Kaggle 2 × T4 (ZETA6 open-source), cách chạy của tác giả (base.yaml): schema
# qua structured outputs, sampling = generation_config. T4: fp16 đầy đủ (~16 GiB weight) chia 2 card (tensor parallel, ~8,5 GiB / card)
# + KV / card. Few-shot tác giả = 3 ảnh / prompt ⇒ max_dynamic_patch 4 (<= 5 ô 448 ≈ 1,3k token / ảnh), max_model_len 12288.
# Pilot 2026-11-04 (vLLM 0.33): `mm_processor_kwargs.max_dynamic_patch` bị truyền cả vào InternVLChatVideoProcessor -> TypeError lúc
# nạp ⇒ đặt qua config model (`hf_overrides`, processor vLLM đọc mặc định từ đây) + tắt video. KV 5 GiB / card (như LLaVA: 11,5 GiB
# / card với KV 3), 24 chuỗi, khối 64.
base: ../base.yaml
name: internvl3.5-8b
backend: vllm
model: OpenGVLab/InternVL3_5-8B
price: {in: 0.0, out: 0.0}
coord: norm1000        # pilot 20 (2026-11-04): 19 / 20 ảnh CE-130, 17 / 20 CoCount mọi toạ độ <= 1000 (đọc 0–1000 ⇒ 94–100 % trong ảnh)
chunk: 64
vllm:
  gpu_mem_gib: 13.5
  kv_cache_gib: 5.0
engine:
  dtype: half
  disable_log_stats: false          # log vLLM ~10 s / lần: token/s, số chuỗi đang chạy, % KV
  trust_remote_code: true
  tensor_parallel_size: 2
  max_model_len: 12288
  max_num_seqs: 24
  limit_mm_per_prompt: {image: 3, video: 0}
  hf_overrides: {max_dynamic_patch: 4}
