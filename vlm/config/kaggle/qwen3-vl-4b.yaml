# Qwen3-VL-4B-Instruct (Qwen, 10/2025) — vLLM offline trên Kaggle 2 × T4 (ZETA6 open-source, chốt 2026-11-04), cách chạy của tác
# giả (base.yaml): schema qua structured outputs, sampling = generation_config của model. T4 (Turing): không bf16 / FP8 / FlashAttention 2
# ⇒ fp16 đầy đủ (~9 GiB weight), chia 2 card (tensor parallel) cho nhiều KV. Few-shot tác giả = 3 ảnh / prompt ⇒ ảnh <= ~1 MP
# (≈ 1,3k token / ảnh), max_model_len 12288. Qwen3-VL học toạ độ thang 0–1000 (prompt tác giả xin pixel) — pilot 2026-11-04: box
# vượt ảnh CE-130 (55 % ngoài 408 × 384); 20 / 20 ảnh mọi toạ độ <= 1000 kể cả ảnh 1440 px; đọc 0–1000 ⇒ 100 % box
# trong ảnh ⇒ `coord: norm1000` (chỉ đổi cách đọc; so lại: `run.py --score-only --coord pixel`).
# Pilot 2026-11-04 (vLLM 0.33, TP 2, KV 3 GiB, 10 ảnh / khối): 7,9 GiB / card, ~14,5 s / ảnh, latency 1 ảnh ~51 s, ra ~1,9k token
# ⇒ KV 8 GiB / card (~116k token ≈ 29 chuỗi ~4k), 32 chuỗi, khối 64.
base: ../base.yaml
name: qwen3-vl-4b
backend: vllm
model: Qwen/Qwen3-VL-4B-Instruct
price: {in: 0.0, out: 0.0}
coord: norm1000        # model trả thang 0–1000 (cách nó được huấn luyện), prompt tác giả giữ nguyên
chunk: 64
# 2026-11-04: 2 bản song song (`data_parallel: 2`, mỗi T4 một bản đủ model, TP 1) thay TP 2 — pilot TP 2: 1 ảnh ~36 token/s, khối 17
# ảnh ~145 token/s (chi phí mỗi bước lớn: allreduce qua host vì T4 không P2P, structured outputs trên CPU). Một card: weight 8,27 GiB,
# còn ~6 GiB ⇒ KV 3,5 GiB ≈ 25k token (147 KB / token) ≈ 6–8 chuỗi / card (TP 2: 116k token ≈ 30 chuỗi). Nhanh hơn TP 2 hay không:
# đọc tốc độ trong log phiên đầu. Quay lại TP 2: data_parallel 1, tensor_parallel_size 2, kv_cache_gib 8.0, max_num_seqs 32 (các khoá
# này ngoài prompt_hash ⇒ câu trả lời đã có vẫn dùng). OOM lúc nạp / chạy: hạ kv_cache_gib 3.0.
vllm:
  gpu_mem_gib: 13.5      # GiB / card cấp cho vLLM (T4 15 GiB)
  kv_cache_gib: 3.5      # / card
  data_parallel: 2       # số bản model chạy song song, mỗi bản một GPU (`run.py` tự mở tiến trình con, chia ảnh theo hash)
engine:
  dtype: half
  disable_log_stats: false          # log vLLM ~10 s / lần: token/s, số chuỗi đang chạy, % KV
  tensor_parallel_size: 1
  max_model_len: 12288
  max_num_seqs: 16
  limit_mm_per_prompt: {image: 3}               # few-shot tác giả: 2 ảnh ví dụ + ảnh hỏi
  mm_processor_kwargs: {max_pixels: 1048576}
