# InternVL3.5-8B (OpenGVLab, 08/2025) — vLLM offline trên MỘT A30 dùng chung, venv riêng (vlm/README.md), cách chạy của tác giả
# (base.yaml): schema qua structured outputs của vLLM, sampling = generation_config của model. bf16 15,9 GiB không vừa GPU trống
# ~9–10 GiB -> FP8 chỉ weight (W8A16 Marlin trên Ampere) ~8 GiB + KV cố định. Few-shot tác giả = 3 ảnh / prompt -> max_model_len
# 12288 (KV ~1,7 GiB cho 1 chuỗi đủ dài), max_dynamic_patch 4 (<= 5 ô 448 ≈ 1,3k token / ảnh). Không đủ chỗ thì hạ: InternVL3_5-4B.
# ZETA6 (open-source).
base: ../base.yaml
name: internvl3.5-8b
backend: vllm
model: OpenGVLab/InternVL3_5-8B
price: {in: 0.0, out: 0.0}
chunk: 32
vllm:
  gpu_mem_gib: 10.0      # GiB cấp cho vLLM; GPU trống ít hơn -> dừng ngay
  kv_cache_gib: 2.0
engine:
  trust_remote_code: true
  quantization: fp8_per_tensor
  max_model_len: 12288
  max_num_seqs: 4
  enforce_eager: true
  limit_mm_per_prompt: {image: 3}               # few-shot tác giả: 2 ảnh ví dụ + ảnh hỏi
  mm_processor_kwargs: {max_dynamic_patch: 4}
