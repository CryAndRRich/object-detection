# LLaVA-OneVision-2-8B-Instruct (lmms-lab, 05/2026; nền Qwen3-8B) — vLLM >= 0.25.0 (`LlavaOnevision2ForConditionalGeneration`), cách
# chạy của tác giả (base.yaml): schema qua structured outputs của vLLM, sampling = generation_config. Docs KHÔNG nói có ra box
# (grounding 2D trong bài báo ra điểm pixel); pilot hỏng thì hạ về llava-hf/llava-onevision-qwen2-7b-ov-hf (bản HiddenObjects dùng).
# Few-shot tác giả = 3 ảnh / prompt -> ảnh <= ~1 MP (processor Qwen2-VL, ≈ 1,3k token / ảnh), max_model_len 12288. ZETA6 (open-source).
base: ../base.yaml
name: llava-ov2-8b
backend: vllm
model: lmms-lab-encoder/LLaVA-OneVision-2-8B-Instruct
price: {in: 0.0, out: 0.0}
chunk: 32
chat_template_kwargs: {enable_thinking: false}   # nền Qwen3: tắt suy nghĩ nếu template có cờ này
vllm:
  gpu_mem_gib: 10.0
  kv_cache_gib: 2.0
engine:
  trust_remote_code: true
  quantization: fp8_per_tensor
  max_model_len: 12288
  max_num_seqs: 4
  enforce_eager: true
  limit_mm_per_prompt: {image: 3}
  mm_processor_kwargs: {max_pixels: 1048576}
