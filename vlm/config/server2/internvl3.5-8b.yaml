# InternVL3.5-8B (ZETA6) trên server 2 (RTX PRO 5000 Blackwell 48 GB, vLLM 0.33, venv `envs/vllm`). Như `kaggle/internvl3.5-8b.yaml`
# (prompt / few-shot tác giả, schema qua structured outputs, ảnh max_dynamic_patch 4, max_model_len 12288, coord norm1000) — chỉ khác:
# - dtype bfloat16 (model học bf16; T4 buộc fp16) ⇒ prompt_hash khác bản Kaggle (Kaggle chưa có câu trả lời full, không mất gì);
# - một card, không tensor parallel; KV 24 GiB (KV / token = 2 × 36 lớp × 8 KV head × 128 × 2 B = 144 KiB ⇒ ~175k token; 2 ảnh
#   few-shot dùng chung qua prefix cache), 48 chuỗi.
base: ../base.yaml
name: internvl3.5-8b
backend: vllm
model: OpenGVLab/InternVL3_5-8B
price: {in: 0.0, out: 0.0}
coord: norm1000        # pilot 20 Kaggle (2026-11-04): 19 / 20 ảnh CE-130, 17 / 20 CoCount mọi toạ độ <= 1000
chunk: 64
vllm:
  gpu_mem_gib: 44.0
  kv_cache_gib: 24.0
engine:
  dtype: bfloat16
  disable_log_stats: false
  trust_remote_code: true
  max_model_len: 12288
  max_num_seqs: 48
  limit_mm_per_prompt: {image: 3, video: 0}
  hf_overrides: {max_dynamic_patch: 4}      # mm_processor_kwargs bị truyền cả vào video processor (TypeError, vLLM 0.33)
