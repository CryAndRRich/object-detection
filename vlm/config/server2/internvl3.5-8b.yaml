# InternVL3.5-8B (ZETA6) trên server 2 (RTX PRO 5000 Blackwell 48 GB, vLLM 0.33, venv `envs/vllm`): prompt / few-shot tác giả, schema
# qua structured outputs, ảnh max_dynamic_patch 4, max_model_len 12288, coord norm1000 (pilot 20 Kaggle 2026-11-04: 19 / 20 ảnh CE-130,
# 17 / 20 CoCount mọi toạ độ <= 1000), bf16 (model học bf16). Full xong 2026-11-07 (44 GiB, KV 24 GiB lúc GPU trống).
# Hiện 28 GiB (KV 8 GiB ≈ 58k token, ~20 chuỗi; KV / token = 2 × 36 lớp × 8 KV head × 128 × 2 B = 144 KiB) — chạy được cạnh job người
# khác (đo latency, batch 1). `vllm.*`, `max_num_seqs` ngoài hash ⇒ đổi không mất resume.
base: ../base.yaml
name: internvl3.5-8b
backend: vllm
model: OpenGVLab/InternVL3_5-8B
price: {in: 0.0, out: 0.0}
coord: norm1000
chunk: 64
vllm:
  gpu_mem_gib: 28.0
  kv_cache_gib: 8.0
engine:
  dtype: bfloat16
  disable_log_stats: false
  trust_remote_code: true
  max_model_len: 12288
  max_num_seqs: 48
  limit_mm_per_prompt: {image: 3, video: 0}
  hf_overrides: {max_dynamic_patch: 4}      # mm_processor_kwargs bị truyền cả vào video processor (TypeError, vLLM 0.33)
