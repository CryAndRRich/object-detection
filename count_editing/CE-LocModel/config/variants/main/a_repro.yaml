# Variant (a) — reproduce CE-Loc gốc (ResNet18 + Conv1D U-Net).
#
# Đây là baseline cho 3 variant chính (a/b/c) — mỗi variant chỉ đổi ĐÚNG 1 thứ so với file này.
# Kiến trúc giống hệt `config/variants/resnet18_cnn.yaml` (1 trong 8 biến thể ablation encoder) —
# không tạo model mới, chỉ đặt tên/save_dir riêng (`checkpoints/main/a_repro/`) để 3 kết quả
# variant chính không lẫn với 8 kết quả ablation khi so sánh.
vision_encoder:
  model_name: "resnet18"
  pretrained: true
  output_dim: 128           # Dimension of visual features

text_encoder:
  model_name: "openai/clip-vit-base-patch32"
  output_dim: 128           # Dimension of text features
  freeze: true

noise_net:
  type: "cnn"
  input_dim: 4              # Bounding Box (x, y, w, h)
  global_cond_dim: 256      # 128 (Vision) + 128 (Text)
  down_dims: [64, 128, 256] # Channel sizes for U-Net
  kernel_size: 3
  n_groups: 8
  # FiLM đầy đủ: out = scale*out + bias. Diffusion Policy gốc đặt True ở MỌI config
  # released; CE-Loc copy sang nhưng không truyền key này nên chạy ở nhánh chỉ-cộng-bias.
  cond_predict_scale: true

diffusion:
  num_timesteps: 1000      # README official: giá trị đã train thật (yaml gốc để default 100)
