# Variant (2) — đổi noise net CNN -> Transformer (encoder-decoder + cross-attention
# của Diffusion Policy), vẫn sinh 1 box/lần. So với a_cnn_1box.yaml CHỈ block
# noise_net đổi; vision_encoder/text_encoder/diffusion giữ y hệt.
vision_encoder:
  model_name: "resnet18"
  pretrained: true
  output_dim: 128
  in_channels: 3

text_encoder:
  model_name: "openai/clip-vit-base-patch32"
  output_dim: 128
  freeze: true

noise_net:
  type: "transformer"
  input_dim: 4
  global_cond_dim: 256
  transformer:
    n_layer: 8
    n_head: 8
    n_emb: 256
    p_drop_emb: 0.1
    p_drop_attn: 0.3
    n_cond_layers: 0     # 0 = MLP cond encoder (mặc định mọi config Diffusion Policy released)
  num_proposals: 1

diffusion:
  num_timesteps: 1000
