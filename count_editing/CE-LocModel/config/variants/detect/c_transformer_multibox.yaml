# Variant (3) — Transformer + cơ chế sinh box/loss của DiffusionDet: sinh N box
# CÙNG LÚC (q_sample trên N proposal, Hungarian matching, DDIM). So với
# b_transformer_1box.yaml CHỈ đổi num_proposals (1 -> 300) + block diffusion
# (snr_scale/sampling_steps/loss, vốn chỉ có tác dụng ở nhánh multi-box).
vision_encoder:
  model_name: "resnet18"
  pretrained: true
  output_dim: 128
  in_channels: 3

text_encoder:
  model_name: "openai/clip-vit-base-patch32"
  output_dim: 128
  freeze: true

noise_net:
  type: "transformer"
  input_dim: 4
  global_cond_dim: 256
  transformer:
    n_layer: 8
    n_head: 8
    n_emb: 256
    p_drop_emb: 0.1
    p_drop_attn: 0.3
    n_cond_layers: 0
  # 300 = đúng giá trị DiffusionDet gốc. Nhánh transformer không bị ràng buộc
  # "N chia hết 4" như ConditionalUnet1D (không có downsample trục box).
  # Trên CE-130 detection: box/ảnh mean 37,6-48,5 tuỳ split, max 1229; N=300 phủ
  # ~99% ảnh không bị cắt bớt box.
  num_proposals: 300
  # 1 = SCORE head: "box này có phải vật thật không". Nhãn lấy từ chính Hungarian
  # matching (matched=1, còn lại kể cả padding=0). CE-130 mỗi ảnh chỉ có ĐÚNG 1
  # class (đo: 3598/3598 ảnh) nên phân loại class là vô nghĩa — score head là
  # phần DÙNG ĐƯỢC của class head trên bộ này, và đúng thứ mà box_renewal /
  # use_ensemble / AP cần.
  num_classes: 1

diffusion:
  num_timesteps: 1000
  snr_scale: 2.0        # DiffusionDet SNR_SCALE
  sampling_steps: 4     # DDIM steps lúc test
  loss: "l1_giou"       # L1 + GIoU trên x0 đã match, đúng loss_boxes của DiffusionDet
  # Trọng số + focal đúng DiffusionDet (config.py:34-36, ALPHA=0.25, GAMMA=2.0).
  l1_weight: 5.0
  giou_weight: 2.0
  cls_loss_weight: 2.0
  focal_alpha: 0.25
  focal_gamma: 2.0
