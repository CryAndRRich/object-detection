# ZETA2 = CSANet (BMVC 2024) — finetune CE-130 train theo bản tác giả bài (refs/CSANet/finetune.py) từ weight công bố (OPA, 18.pth).
# Batch 64 như CE-Loc; lr = lr THỰC TẾ của tác giả (finetune của tác giả nạp lại optimizer từ checkpoint ⇒ chạy ở lr lưu trong đó,
# không phải lr đặt trong script), không nhân √ tỉ lệ batch. Ảnh thật cho D = ảnh vật dán ở trans GT; gamma khối chú ý không train;
# best = epoch cuối (sửa 2026-11-07, ZETA mục 11.3). docs/EXPERIMENT_ZETA.md mục 8–11.
method: csanet
model:
  img_size: 256
  d_noise: 1024
  d_model: 512
  d_k: 64
  d_v: 64
  n_heads: 8
finetune:
  init: ../weights/add/zeta2/pretrained/csanet_opa_ep18.pth
  epochs: 10
  batch_size: 64               # toàn cục; 2 GPU × 32
  micro_batch: 8                # fp32: 8 ảnh / lượt ~ bộ nhớ của 16 ở fp16 (13,5 GB / T4)
  lr: 2.0e-5                   # như tác giả: VGG 2e-5, phần còn lại của G × 10 = 2e-4, D 2e-5
  b1: 0.5
  b2: 0.999
  blend_mask: object           # mask DÁN ảnh ghép cho D = mask thật vật đã xoá (G vẫn nhận mask chữ nhật như lúc test) — dán chữ nhật
                               # ⇒ ảnh thật liền mạch, D phân biệt bằng viền (finetune lại 2026-11-07 vẫn D thắng dần, ZETA mục 11.3)
  eval_mode: true              # G + D eval mode cả lúc train, như bản gốc (BN đóng băng, tắt dropout) — methods/csanet.py Trainer
  amp: false                   # fp32 như bản gốc: fp16 tràn số (AMP scale 32768 -> 16 sau 60 bước, rồi NaN) — Kaggle 2026-10-31
  num_workers: 2
  log_every: 20
  seed: 42
predict:
  k: 30
  fg_select: random
  batch_images: 2              # 2 ảnh × 30 lần rút = 60 ảnh 256² qua VGG fp32 (~2–3 GB); không đổi kết quả (nhiễu seed theo mẫu)
