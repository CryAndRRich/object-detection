# EXPERIMENT BETA0 — ALPHA0 giám sát bằng ĐIỂM density (không dùng box GT khi train).
# Kế hoạch: docs/EXPERIMENT_BETA.md (gốc multi_condition/). beta0 = alpha0.yaml + ĐÚNG các khoá
# đánh dấu [BETA] (data.targets / points / pseudo_size, loss.center_weight / size_weight,
# eval.select_metric); còn lại y hệt alpha0.

experiment: "beta0"
description: "ALPHA0 (RGB, memory [t ; text], N=200) giám sát bằng điểm density full + cỡ giả kNN"

data:
  root: "../data/all_phase2_V2"     # tương đối so với ce_localization/
  image_size: 1024                  # letterbox góc trên-trái như CE-Loc gốc, không augmentation.
                                    # 512 (ALPHA0 đầu, 2026-09-29) thu nhỏ đa số ảnh -> vật < 32 px
                                    # recall 0,35 (docs mục 12.3) -> người dùng chốt 1024
  num_workers: 4
  targets: "point"                  # [BETA] đích train = box giả từ điểm density (box GT chỉ để chấm)
  points: "../data/density_points.json"   # [BETA] cửa G0: tools/build_density_points.py
  pseudo_size:                      # [BETA] ŝ = clamp(beta · TB khoảng cách tới knn điểm gần nhất,
    knn: 3                          #        min_frac·nh, max_frac·nh), nh = chiều cao vùng ảnh thật
    beta: 0.9128                    # đề xuất G0 (2026-09-30, tau 8 radius 2): 1 / trung vị kNN3/sqrt(wh)
    min_frac: 0.01841               # p2 của sqrt(wh)/H box GT train
    max_frac: 0.29036               # p98

model:
  memory: "none"                    # none | spatial_softmax | grid
  d_model: 256
  n_stage: 6
  n_head: 4                         # y nguyên tầng decoder của DP (config hybrid)
  dim_feedforward: 1024
  dropout: 0.3
  text_dim: 512
  clip_text: "openai/clip-vit-base-patch32"   # CLIP text frozen như CE-Loc gốc
  grid_size: 16                     # chỉ ALPHA2: pool vùng thật của P5 (32×32 @1024) về 16×16 = 256 token
  pretrained_backbone: true         # R-50 ImageNet; mọi lớp conv train, BN đóng băng

diffusion:
  num_timesteps: 1000               # cosine
  snr_scale: 2.0
  num_proposals: 200                # train và eval

matcher:
  ota_k: 5
  center_radius: 2.5

loss:
  class_weight: 2.0
  l1_weight: 5.0
  giou_weight: 2.0
  alpha: 0.25
  gamma: 2.0
  prior_prob: 0.01
  center_weight: 5.0                # [BETA] L1 tâm (chuẩn hoá theo vùng ảnh thật), = l1_weight của ALPHA
  size_weight: 1.0                  # [BETA] L1 log-cỡ so với ŝ (λ); l1_weight / giou_weight không dùng

training:
  batch_size: 2                     # TOÀN CỤC; Kaggle 2 GPU -> 1 ảnh/GPU
  lr: 1.0e-4                         # lr của Diffusion Policy; G3 2026-09-29: 8,84e-6 học quá chậm
  weight_decay: 1.0e-4
  max_iter: 12000
  steps: [9000, 11000]
  gamma: 0.1
  warmup_iters: 1000
  warmup_factor: 0.01
  grad_clip: 1.0                    # toàn mô hình, L2
  seed: 0
  log_every: 20
  ckpt_every: 1000
  eval_every: 2000

eval:
  split: "val"                      # eval định kỳ + chọn best.pth; báo cáo trên test (eval.py)
  select_metric: "oracle_recall_pt" # [BETA] tâm trong box GT (box GT chỉ để CHẤM, matcher/loss không thấy)
  sampling_steps: 1                 # chính: 1 bước
  batch_size: 2                     # @1024 batch 8 OOM trên GPU dùng chung (2026-09-29); không đổi kết quả
  top_k: 100
  nms_thr: 0.5
