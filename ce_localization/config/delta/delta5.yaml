# DELTA5 (docs/EXPERIMENT_DELTA.md mục 11) = DELTA4 + bản log-scale của tác giả (refs/CE-Loc-logScale/): box w, h trên thang log (box đích,
# box vật, RoIAlign của refiner, giải mã khi eval), loss phụ thêm GIoU, val bằng sampler DDIM/DDPM của tác giả (eta 1, 100 bước, x̂0 kẹp).
# delta5 / 5_1 / 5_3 / 5_2 / 5_4 / 5_5 chỉ khác `aux_giou_weight` 0 / 0,1 / 0,25 / 0,5 / 0,75 / 1,0.
base: delta4.yaml
experiment: "delta5"
description: "DELTA4 + box mã hoá log (w, h) + sampler DDIM của tác giả; loss phụ GIoU 0"
model:
  box_coder: {type: log, min_size_ratio: 0.0078125}   # cạnh nhỏ nhất 1/128 canvas, như tác giả
  refiner:
    aux_giou_weight: 0.0
eval:
  sample_kw: {sampler: "ddim", ddim_steps: 100, eta: 1.0}
