# EXPERIMENT DELTA6 (docs/EXPERIMENT_DELTA.md mục 12, người dùng chốt 2026-10-23) = delta4.yaml (DELTA4: box linear, sampler mock, không GIoU) train lại theo giao thức
# của CE-Loc gốc: KHÔNG val (`eval.split: null`), `best.pth` = epoch có loss train TB thấp nhất (`select_metric: train_loss`);
# giữ 120 epoch nhưng lr 1e-4 + warmup 1 epoch + cosine về 0 đúng ở max_iter 37.440. Mọi khoá model / diffusion Y HỆT delta4.yaml
# (có test). delta6 / 6_1 / 6_2 = train lại delta4 / delta5_2 / delta5_4. Test: eval.py --split test_all (toàn bộ samples/test).

experiment: "delta6"
description: "DELTA6 = DELTA4 với giao thức train của CE-Loc gốc (không val, best theo loss train) + lr 1e-4 cosine về 0"
task: "add"

data:
  root: "../data/all_phase2_V2"
  samples_root: "../data/samples"
  turn_index: "../data/turn_index.json"
  density_index: "../data/density_index.json"   # eval ảnh gốc với density `full`
  density_root: "../data/samples"
  split_source: "samples"           # train = samples/train ; val / test = samples/test theo split CE-130 của ảnh gốc
  cache_dir: null                   # Kaggle: --cache-dir /kaggle/temp/add_cache (tools/build_add_cache.py)
  image_size: 512
  num_workers: 4
  density: "sample"

model:
  arch: "box_policy"
  vision: "r18_paper"               # ResNet18 của bài (BN train, ImageNet, conv1 kênh 4 = TB RGB), box chia canvas
  ss_mask: true                     # SpatialSoftmax: ô đệm −inf trước softmax (lưới toạ độ canvas của bài)
  in_channels: 4
  pretrained_backbone: true
  vis_dim: 128                      # Linear(2·512, 128) như bài
  text_dim: 512
  text_proj_dim: 128
  step_embed_dim: 256
  down_dims: [64, 128, 256]
  kernel_size: 3
  n_groups: 8
  clip_text: "openai/clip-vit-base-patch32"
  obj_attn: true                    # GAMMA4: cross-attn tới box vật đang có ở 6 vị trí U-Net (models/unet1d.py)
  obj_heads: 4
  obj_max: 300                      # > 300 vật: train lấy ngẫu nhiên 300 (p99 train 248), eval giữ hết
  use_condition: true                # false = DELTA1.1
  refiner:                          # BoxRefiner của tác giả gốc (refs/CE-Loc-update/config/model_config.yaml) — mặc định NGUYÊN VĂN
    enabled: true
    clip_model_name: "openai/clip-vit-base-patch32"   # CLIP ViT frozen (lưới 7×7); không vào checkpoint (vân tay clip_sha)
    text_model_name: "openai/clip-vit-base-patch16"   # token chữ: CLIP text B/16 như DELTA1
    vision_layer: -2
    d_model: 256
    num_layers: 4
    num_heads: 8                    # head_dim 32 chia hết cho 4 (RoPE 2D)
    mlp_ratio: 4.0
    dropout: 0.0
    rope_theta: 100.0
    roi_size: 3
    num_stages: 1
    use_density: true               # density pool về lưới token ảnh, cộng vào token ảnh
    unet_input: concat              # U-Net nhận [x_t ; refined] (8 kênh), ra ε 4 kênh
    aux_loss_weight: 0.1            # + 0,1 · MSE(refined, x0)
    attention_flow:                 # nhóm query -> nhóm key (ảnh / text không nhìn box)
      sample: [sample, image, text]
      image: [image, text]
      text: [text, image]


diffusion:
  num_timesteps: 1000
  beta_start: 1.0e-4
  beta_end: 0.02
  noise_per_image: 1

training:                           # DELTA6.x (2026-10-23): cùng 120 epoch như DELTA4 / 5.x, lr 1e-4 + cosine VỀ 0 trong đúng 120 epoch
  batch_size: 64                    # TOÀN CỤC: Kaggle 2 GPU -> 32 / GPU
  sync_bn: false                    # BN thường: thống kê trên 32 ảnh / GPU = đúng batch BN của bài (SyncBN sẽ thành 64, chậm hơn)
  amp: true                         # Kaggle T4: autocast fp16 + GradScaler + channels_last (tensor core) — người dùng chốt 2026-10-02
  lr: 1.0e-4                        # tác giả 5e-5 ở batch 32 (train.sh) -> × 2 theo batch 64; = default.yaml của tác giả
  weight_decay: 0.01
  schedule: "cosine"
  cosine_warmup_iters: 312          # warmup tuyến tính 1 epoch
  cosine_t_max: 37440               # = max_iter: lr về 0 ở epoch 120 (DELTA4 / 5.x: t_max 93.900 ⇒ lr cuối còn 65 % lr đầu)
  max_iter: 37440                   # = 120 epoch × 312 iter (⌊19.998 / 64⌋)
  grad_clip: null
  seed: 0
  log_every: 50
  ckpt_every: 1000

eval:                               # KHÔNG val (như CE-Loc gốc); test trên server: eval.py --split test_all (6.122 mẫu)
  split: null
  n_samples: 30
  batch_size: 16
  sample_kw: {sampler: "mock"}      # eval định kỳ bằng vòng mock 100 bước của bài (DDPM 1000 bước quá chậm trên T4); test báo cả hai
  select_metric: "train_loss"       # best.pth = loss train TB / epoch thấp nhất (train.py của tác giả)
