# EXPERIMENT DELTA3.2 (docs/EXPERIMENT_DELTA.md mục 10.2) = delta4.yaml với refiner đặt SAU U-Net (`unet_input: post`, như delta3_1).
# U-Net nhận x_t 4 kênh nên box vật mã hoá gương như GAMMA4 (không [o ; o]). CHỈ khác delta4 ở `unet_input` / `aux_loss_weight`
# (có test) ⇒ delta4 là đối chứng (thứ tự).

experiment: "delta3_2"
description: "DELTA4 với refiner SAU U-Net: box attention tới mọi vật, U-Net ra ε̂₁, refiner (CLIP B/32) nhìn x̂0 của U-Net và sửa ε"
task: "add"

data:
  root: "../data/all_phase2_V2"
  samples_root: "../data/samples"
  turn_index: "../data/turn_index.json"
  density_index: "../data/density_index.json"   # eval ảnh gốc với density `full`
  density_root: "../data/samples"
  split_source: "samples"           # train = samples/train ; val / test = samples/test theo split CE-130 của ảnh gốc
  cache_dir: null                   # Kaggle: --cache-dir /kaggle/temp/add_cache (tools/build_add_cache.py)
  image_size: 512
  num_workers: 4
  density: "sample"

model:
  arch: "box_policy"
  vision: "r18_paper"               # ResNet18 của bài (BN train, ImageNet, conv1 kênh 4 = TB RGB), box chia canvas
  ss_mask: true                     # SpatialSoftmax: ô đệm −inf trước softmax (lưới toạ độ canvas của bài)
  in_channels: 4
  pretrained_backbone: true
  vis_dim: 128                      # Linear(2·512, 128) như bài
  text_dim: 512
  text_proj_dim: 128
  step_embed_dim: 256
  down_dims: [64, 128, 256]
  kernel_size: 3
  n_groups: 8
  clip_text: "openai/clip-vit-base-patch32"
  obj_attn: true                    # GAMMA4: cross-attn tới box vật đang có ở 6 vị trí U-Net (models/unet1d.py)
  obj_heads: 4
  obj_max: 300                      # > 300 vật: train lấy ngẫu nhiên 300 (p99 train 248), eval giữ hết
  use_condition: true                # false = DELTA1.1
  refiner:                          # BoxRefiner của tác giả gốc (refs/CE-Loc-update/config/model_config.yaml) — mặc định NGUYÊN VĂN
    enabled: true
    clip_model_name: "openai/clip-vit-base-patch32"   # CLIP ViT frozen (lưới 7×7); không vào checkpoint (vân tay clip_sha)
    text_model_name: "openai/clip-vit-base-patch16"   # token chữ: CLIP text B/16 như DELTA1
    vision_layer: -2
    d_model: 256
    num_layers: 4
    num_heads: 8                    # head_dim 32 chia hết cho 4 (RoPE 2D)
    mlp_ratio: 4.0
    dropout: 0.0
    rope_theta: 100.0
    roi_size: 3
    num_stages: 1
    use_density: true               # density pool về lưới token ảnh, cộng vào token ảnh
    unet_input: post                # U-Net TRƯỚC (nhận x_t, 4 kênh) -> ε̂₁; refiner nhìn x̂0 của U-Net, sửa ε: ε̂ = ε̂₁ + Δε
    aux_loss_weight: 1.0            # post: loss = MSE(ε̂, ε) + 1 · MSE(ε̂₁, ε) (U-Net tự đứng được)
    attention_flow:                 # nhóm query -> nhóm key (ảnh / text không nhìn box)
      sample: [sample, image, text]
      image: [image, text]
      text: [text, image]


diffusion:
  num_timesteps: 1000
  beta_start: 1.0e-4
  beta_end: 0.02
  noise_per_image: 1

training:                           # như bài trừ batch (gấp đôi) / số iter (nửa)
  batch_size: 64                    # TOÀN CỤC: Kaggle 2 GPU -> 32 / GPU
  sync_bn: false                    # BN thường: thống kê trên 32 ảnh / GPU = đúng batch BN của bài (SyncBN sẽ thành 64, chậm hơn)
  amp: true                         # Kaggle T4: autocast fp16 + GradScaler + channels_last (tensor core) — người dùng chốt 2026-10-02
  lr: 5.0e-5
  weight_decay: 0.01
  schedule: "cosine"
  cosine_t_max: 93900               # = 300 epoch × 313 bước (⌈19.998 / 64⌉) — CosineAnnealingLR(T_max=300) của bài theo iter
  max_iter: 37500
  grad_clip: null
  seed: 0
  log_every: 50
  ckpt_every: 1000
  eval_every: 2500

eval:
  split: "val"
  limit: 500
  n_samples: 30
  batch_size: 16
  sample_kw: {sampler: "mock"}      # eval định kỳ bằng vòng mock 100 bước của bài (DDPM 1000 bước quá chậm trên T4); test báo cả hai
  select_metric: "mean_iou_any"
