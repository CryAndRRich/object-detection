base: [delta6.yaml]
experiment: "delta7"
description: "DELTA6 + đích train = 1 box ngẫu nhiên / ảnh trong mọi lỗ + chỗ trống gán tay không trùng lỗ, thay vì lỗ mới nhất"
data:
  train_target: "positive"
