# DELTA4 (docs/EXPERIMENT_DELTA.md mục 10) = GAMMA4 (CE-Loc gốc ResNet18 + cross-attn box nhiễu -> MỌI box vật ở 6 vị trí U-Net) + BoxRefiner
# của tác giả trước U-Net (CLIP ViT-B/32, token chữ CLIP text B/16); U-Net nhận [x_t ; refined], box vật vào dạng gương [o ; o].
# Mọi config sau kế thừa file này qua `base` (utils/config.py).

experiment: "delta4"
description: "GAMMA4 (box attention tới mọi vật) + BoxRefiner của tác giả (CLIP ViT-B/32, text B/16) trước U-Net"
task: "add"

data:
  root: "../data/all_phase2_V2"
  samples_root: "../data/samples"
  turn_index: "../data/turn_index.json"
  density_index: "../data/density_index.json"   # eval ảnh gốc: density `full` của ảnh gốc
  density_root: "../data/samples"
  cache_dir: null                   # Kaggle: --cache-dir (tools/build_add_cache.py)
  image_size: 512
  num_workers: 4

model:
  arch: "box_policy"
  vision: "r18_paper"               # ResNet18 của bài (BN train, ImageNet, conv1 kênh 4 = TB RGB)
  ss_mask: true                     # SpatialSoftmax: ô đệm −inf trước softmax
  in_channels: 4                    # RGB + density
  pretrained_backbone: true
  vis_dim: 128
  text_dim: 512
  text_proj_dim: 128
  step_embed_dim: 256
  down_dims: [64, 128, 256]
  kernel_size: 3
  n_groups: 8
  clip_text: "openai/clip-vit-base-patch32"
  obj_attn: true                    # cross-attn tới box vật đang có
  obj_heads: 4
  obj_max: 300                      # train: > 300 vật lấy ngẫu nhiên 300 (p99 train 248); eval giữ hết
  refiner:                          # mặc định của tác giả (refs/CE-Loc-update/config/model_config.yaml)
    enabled: true
    clip_model_name: "openai/clip-vit-base-patch32"   # CLIP ViT frozen (lưới 7×7), không vào checkpoint (vân tay clip_sha)
    text_model_name: "openai/clip-vit-base-patch16"
    vision_layer: -2
    d_model: 256
    num_layers: 4
    num_heads: 8
    mlp_ratio: 4.0
    dropout: 0.0
    rope_theta: 100.0
    roi_size: 3
    num_stages: 1
    use_density: true
    unet_input: concat
    aux_loss_weight: 0.1            # loss = ε-MSE + 0,1 · [MSE(refined, x0) + aux_giou_weight · (1 − GIoU)]
    attention_flow:                 # nhóm query -> nhóm key (ảnh / text không nhìn box)
      sample: [sample, image, text]
      image: [image, text]
      text: [text, image]

diffusion:
  num_timesteps: 1000
  beta_start: 1.0e-4
  beta_end: 0.02
  noise_per_image: 1

training:
  batch_size: 64                    # TOÀN CỤC: Kaggle 2 GPU -> 32 / GPU
  sync_bn: false                    # BN thường: 32 ảnh / GPU = batch BN của bài
  amp: true                         # fp16 + GradScaler + channels_last (Kaggle T4)
  lr: 5.0e-5
  weight_decay: 0.01
  schedule: "cosine"
  cosine_t_max: 93900               # 300 epoch × 313 bước (cắt ở max_iter ⇒ lr cuối còn 65 % — DELTA6 sửa)
  max_iter: 37500
  grad_clip: null
  seed: 0
  log_every: 50
  ckpt_every: 1000
  snapshot_every_epochs: null       # N: weight `snapshots/epNNN.pth` mỗi N epoch (eval sau trên server)
  snapshot_initial: false           # true: thêm `snapshots/ep000.pth` = weight khởi tạo, trước iter 0 (không ghi khi --resume)
  eval_every: 2500

eval:                               # val định kỳ chọn best.pth
  split: "val"
  limit: 500
  n_samples: 30
  batch_size: 16
  sample_kw: {sampler: "mock"}      # vòng mock 100 bước của bài
  select_metric: "mean_iou_any"
