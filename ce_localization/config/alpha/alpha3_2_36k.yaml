# EXPERIMENT ALPHA3.2 train 36k iter (≈ 38 epoch, gấp 3 lần alpha3_2.yaml) — kiểm giả thuyết "12,6 epoch quá
# ngắn cho họ query / khuếch tán" (docs/EXPERIMENT_ALPHA.md mục 12.5, gốc multi_condition/).
# CHỈ khác alpha3_2.yaml ở `training` (max_iter, steps giữ đúng tỉ lệ 75 % / 92 %).

experiment: "alpha3_2_36k"
description: "ALPHA0 + density kênh 4 (conv1 khởi tạo 0); train density KHÔNG cố định (full / thiếu vật / trống); 36k iter"

data:
  root: "../data/all_phase2_V2"     # tương đối so với ce_localization/
  image_size: 1024                  # letterbox góc trên-trái như CE-Loc gốc, không augmentation.
                                    # 512 (ALPHA0 đầu, 2026-09-29) thu nhỏ đa số ảnh -> vật < 32 px
                                    # recall 0,35 (docs mục 12.3) -> người dùng chốt 1024
  num_workers: 4
  density: "mix"                   # mix = mỗi ảnh mỗi epoch: 1/3 full · 1/3 bản thiếu vật ngẫu nhiên · 1/3 trống
  density_root: "../data/samples"   # samples/{train,test}/density/{iid}_{k}.png (tra theo iid)
  density_index: "../data/density_index.json"   # tools/build_density_index.py, dựng một lần

model:
  memory: "none"                    # none | spatial_softmax | grid
  in_channels: 4                    # RGB chuẩn hoá ImageNet + density [0,1]
  d_model: 256
  n_stage: 6
  n_head: 4                         # y nguyên tầng decoder của DP (config hybrid)
  dim_feedforward: 1024
  dropout: 0.3
  text_dim: 512
  clip_text: "openai/clip-vit-base-patch32"   # CLIP text frozen như CE-Loc gốc
  grid_size: 16                     # chỉ ALPHA2: pool vùng thật của P5 (32×32 @1024) về 16×16 = 256 token
  pretrained_backbone: true         # R-50 ImageNet; mọi lớp conv train, BN đóng băng

diffusion:
  num_timesteps: 1000               # cosine
  snr_scale: 2.0
  num_proposals: 200                # train và eval

matcher:
  ota_k: 5
  center_radius: 2.5

loss:
  class_weight: 2.0
  l1_weight: 5.0
  giou_weight: 2.0
  alpha: 0.25
  gamma: 2.0
  prior_prob: 0.01

training:
  batch_size: 2                     # TOÀN CỤC; Kaggle 2 GPU -> 1 ảnh/GPU
  lr: 1.0e-4                         # lr của Diffusion Policy; G3 2026-09-29: 8,84e-6 học quá chậm
  weight_decay: 1.0e-4
  max_iter: 36000                   # alpha3_2: 12000 (val còn tăng ở cuối)
  steps: [27000, 33000]             # cùng tỉ lệ với [9000, 11000] / 12000
  gamma: 0.1
  warmup_iters: 1000
  warmup_factor: 0.01
  grad_clip: 1.0                    # toàn mô hình, L2
  seed: 0
  log_every: 20
  ckpt_every: 1000
  eval_every: 2000

eval:
  split: "val"                      # eval định kỳ + chọn best.pth; báo cáo trên test (eval_alpha.py)
  select_metric: "oracle_recall"
  density: "full"                   # eval định kỳ (chọn best.pth) với density đầy đủ; test: full / partial / empty
  sampling_steps: 1                 # chính: 1 bước
  batch_size: 2                     # @1024 batch 8 OOM trên GPU dùng chung (2026-09-29); không đổi kết quả
  top_k: 100
  nms_thr: 0.5
