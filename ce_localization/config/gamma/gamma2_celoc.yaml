# EXPERIMENT GAMMA2 — pha 1: train lại CE-Loc gốc (ResNet18 như bài) + SpatialSoftmax MASK phần đệm, dữ liệu samples/ như bài.
# Backbone ResNet18 này DÙNG CHUNG với model refine ở pha 2 (gamma2 / gamma2_1). Mọi thứ khác y bài: density 4 kênh
# .convert("L") + conv1 kênh 4 = TB RGB, to_tensor, BN train, CLIP -> Linear -> Mish, U-Net 1D + FiLM, ε-MSE, β tuyến tính
# T = 1000, AdamW 5e-5 / wd 0,01 / cosine / không clip, 1 nhiễu mỗi ảnh. Kaggle T4×2: batch toàn cục 64 (gấp đôi bài),
# 37.500 iter (= 75k × 32 / 64 lượt xem ảnh của bài). Kế hoạch: docs/EXPERIMENT_GAMMA.md mục 13.

experiment: "gamma2_celoc"
description: "bài add: CE-Loc gốc train lại (ResNet18, SpatialSoftmax mask phần đệm), samples/ như bài; backbone dùng chung với refine GAMMA2"
task: "add"

data:
  root: "../data/all_phase2_V2"
  samples_root: "../data/samples"
  turn_index: "../data/turn_index.json"
  density_index: "../data/density_index.json"   # eval ảnh gốc với density `full`
  density_root: "../data/samples"
  split_source: "samples"           # train = samples/train ; val / test = samples/test theo split CE-130 của ảnh gốc
  cache_dir: null                   # Kaggle: --cache-dir /kaggle/temp/add_cache (tools/build_add_cache.py)
  image_size: 512
  num_workers: 4
  input_style: "paper"              # to_tensor, density .convert("L")
  density: "sample"

model:
  arch: "box_policy"
  vision: "r18_paper"               # ResNet18 của bài (BN train, ImageNet, conv1 kênh 4 = TB RGB), box chia canvas
  ss_mask: true                     # SpatialSoftmax: ô đệm −inf trước softmax (lưới toạ độ canvas của bài)
  in_channels: 4
  pretrained_backbone: true
  vis_dim: 128                      # Linear(2·512, 128) như bài
  text_dim: 512
  text_proj_dim: 128
  step_embed_dim: 256
  down_dims: [64, 128, 256]
  kernel_size: 3
  n_groups: 8
  clip_text: "openai/clip-vit-base-patch32"

diffusion:
  num_timesteps: 1000
  beta_start: 1.0e-4
  beta_end: 0.02
  noise_per_image: 1

training:                           # như bài trừ batch (gấp đôi) / số iter (nửa)
  batch_size: 64                    # TOÀN CỤC: Kaggle 2 GPU -> 32 / GPU
  sync_bn: false                    # BN thường: thống kê trên 32 ảnh / GPU = đúng batch BN của bài (SyncBN sẽ thành 64, chậm hơn)
  amp: true                         # Kaggle T4: autocast fp16 + GradScaler + channels_last (tensor core) — người dùng chốt 2026-10-02
  lr: 5.0e-5
  weight_decay: 0.01
  schedule: "cosine"
  cosine_t_max: 93900               # = 300 epoch × 313 bước (⌈19.998 / 64⌉) — CosineAnnealingLR(T_max=300) của bài theo iter
  max_iter: 37500
  grad_clip: null
  seed: 0
  log_every: 50
  ckpt_every: 1000
  eval_every: 2500

eval:
  split: "val"
  limit: 500
  n_samples: 30
  batch_size: 16
  sample_kw: {sampler: "mock"}      # eval định kỳ bằng vòng mock 100 bước của bài (DDPM 1000 bước quá chậm trên T4); test báo cả hai
  select_metric: "mean_iou_any"
