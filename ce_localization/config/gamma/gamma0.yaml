# EXPERIMENT GAMMA0 — CE-Loc gốc cho bài ADD, CHỈ đổi ResNet18 -> R-50 (+ Linear(4096, 128) vì C5 2048 kênh) và dữ liệu
# CE-130 (nhánh, lượt). Mọi thứ khác như bài: BN train, to_tensor, SpatialSoftmax không mask, box chia canvas, density
# .convert("L") + kênh conv1 = TB RGB, U-Net 1D + FiLM, ε-MSE, β tuyến tính, AdamW 5e-5 / wd 0,01 / cosine / không
# clip / 1 nhiễu mỗi ảnh; batch 8 (bài 32). Eval DDPM đúng công thức.
# Kế hoạch: docs/EXPERIMENT_GAMMA.md (gốc multi_condition/). gamma0 / gamma0_1 CHỈ khác density
# (data.density + model.in_channels) và experiment / description.

experiment: "gamma0"
description: "bài add: (nhánh, lượt) CE-130, đích lỗ mới nhất; CE-Loc gốc với R-50 (BN train) -> SpatialSoftmax C5 -> FiLM -> U-Net 1D; RGB + density"
task: "add"                         # detect (mặc định, ALPHA / BETA) | add

data:
  root: "../data/all_phase2_V2"     # tương đối so với ce_localization/ (annotation + ground_truth.jpg)
  samples_root: "../data/samples"   # ảnh inpaint + density của từng (nhánh, lượt)
  turn_index: "../data/turn_index.json"     # cửa G0: tools/build_turn_index.py
  density_index: "../data/density_index.json"   # chỉ để eval ảnh gốc với density `full` (chỉ mục ALPHA3)
  density_root: "../data/samples"
  image_size: 512                   # letterbox góc trên-trái như CE-Loc gốc (người dùng chốt 2026-10-01)
  num_workers: 4
  input_style: "paper"              # như bài: to_tensor (/255), density .convert("L"); ours = chuẩn hoá ImageNet + giải mã jet
  density: "sample"                 # density CountGD của CHÍNH ảnh inpaint đó; null = RGB

model:
  arch: "box_policy"                # detector (ALPHA / BETA) | box_policy (GAMMA0)
  in_channels: 4                    # RGB + density
  pretrained_backbone: true         # R-50 ImageNet (bài: ResNet18 ImageNet); mọi lớp train
  ss_source: "c5"                   # SpatialSoftmax trên C5 (layer4 R-50 pretrain, 2048 kênh) như bài; p5 = bản đầu, G3 hỏng
  # "CE-Loc gốc + R-50" (2026-10-01; bản ALPHA — FrozenBN / chuẩn hoá ImageNet / mask / box chia vùng thật — hỏng, mục 12.2):
  backbone_norm: "bn"               # BatchNorm TRAIN (thống kê theo batch) như ResNet18 của bài; frozen = bản ALPHA
  density_init: "rgb_mean"          # kênh density conv1 = TB weight RGB như bài (bỏ qua khi in_channels 3)
  ss_kind: "paper"                  # SpatialSoftmax KHÔNG mask, cả canvas, toạ độ [−1,1] như bài; masked = bản ALPHA
  box_norm: "canvas"                # box chia canvas 512 như bài; valid = chia vùng ảnh thật
  d_model: 256                      # kênh FPN (chỉ dùng khi ss_source: p5)
  vis_dim: 128                      # như CE-Loc gốc: Linear(2·2048, 128)
  text_dim: 512                     # CLIP ViT-B/32 pooler (frozen, tính sẵn)
  text_proj_dim: 128                # như CE-Loc gốc: Linear(512, 128) -> Mish
  step_embed_dim: 256               # U-Net 1D y CE-Loc gốc
  down_dims: [64, 128, 256]
  kernel_size: 3
  n_groups: 8
  clip_text: "openai/clip-vit-base-patch32"

diffusion:
  num_timesteps: 1000               # β tuyến tính 1e-4..0,02, ε-prediction (như CE-Loc gốc)
  beta_start: 1.0e-4
  beta_end: 0.02
  noise_per_image: 1                # 1 bộ (t, ε) mỗi ảnh mỗi bước như bài

training:                           # optimizer / lịch NHƯ BÀI (AdamW 5e-5, wd 0,01, cosine, không clip); batch 8 (bài 32)
  batch_size: 8                     # TOÀN CỤC (người dùng chốt 2026-10-01: GAMMA1 batch 16 OOM trên GPU dùng chung; bài 32); Kaggle 2 GPU -> 4 / GPU + SyncBN
  lr: 5.0e-5
  weight_decay: 0.01
  schedule: "cosine"                # CosineAnnealingLR của bài, theo iter
  cosine_t_max: 187500              # = 300 epoch × 625 bước của bài => lr gần như giữ 5e-5 trong 32k iter (như đoạn đầu lịch bài)
  max_iter: 32000                   # ≈ 19 epoch của 13.454 mẫu ở batch 8 (bài: 75k bước × 32; bản train lại ở epoch 10 đã best-of-30 0,335)
  grad_clip: null                   # bài không clip
  seed: 0
  log_every: 20
  ckpt_every: 1000
  eval_every: 4000                  # 8 lần eval val như trước

eval:
  split: "val"                      # eval định kỳ + chọn best.pth; báo cáo trên test (eval.py)
  limit: 500                        # mẫu val CỐ ĐỊNH cho eval định kỳ (hoán vị seed 12345)
  n_samples: 30                     # box độc lập / mẫu (best-of-30 của bài)
  batch_size: 16
  select_metric: "mean_iou_any"     # IoU TB của MỘT box bất kỳ với lỗ gần nhất (không oracle)
